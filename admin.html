<!DOCTYPE html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/logo1.png" />
    <link rel="apple-touch-icon" href="assets/logo1.png" />
    <title>Administration — Mosquée Bilal</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Playfair+Display:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="nh-site admin-auth-page">
    <div class="nh-bg" aria-hidden="true"></div>

    <header class="nh-header">
      <div class="nh-header-inner">
        <a class="nh-brand" href="index.html" aria-label="Mosquée Bilal">
          <img src="assets/logo1.png" class="nh-brand-logo" alt="Logo Mosquée Bilal" />
          <span class="nh-brand-text">Mosquée Bilal</span>
        </a>
        <nav class="nh-nav" aria-label="Navigation principale">
          <button class="nh-nav-toggle" type="button" aria-label="Menu">
            <span></span><span></span><span></span>
          </button>
          <ul class="nh-nav-list">
            <li><a href="index.html" data-i18n="navHome">ACCUEIL</a></li>
            <li><a href="mosquee.html" data-i18n="navGallery">GALERIE</a></li>
            <li><a href="annonces.html" data-i18n="navAnnonces">ANNONCES</a></li>
            <li><a href="admin.html" class="nh-nav-admin-active" aria-current="page">ADMIN</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="nh-main">
      <section class="admin-login-wrap">
        <div class="admin-login-card">
          <h1>Connexion admin</h1>
          <p>Gérez les annonces de la Mosquée Bilal.</p>
          <form id="loginForm">
            <div class="admin-field">
              <label for="email">Email</label>
              <input id="email" type="email" autocomplete="username" required />
            </div>
            <div class="admin-field">
              <label for="password">Mot de passe</label>
              <input id="password" type="password" autocomplete="current-password" required />
            </div>
            <button class="nh-btn nh-btn-gold" type="submit" style="width: 100%; margin-top: 8px">
              Se connecter
            </button>
          </form>
          <div id="loginMessage" class="admin-login-msg" role="alert"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <script>
      (function () {
        var TOKEN_KEY = "mosquee_admin_jwt";
        var form = document.getElementById("loginForm");
        var msg = document.getElementById("loginMessage");

        function setMsg(text, isError) {
          msg.textContent = text || "";
          msg.className = "admin-login-msg" + (isError ? " error" : text ? " success" : "");
        }

        if (sessionStorage.getItem(TOKEN_KEY)) {
          window.location.replace("/admin/dashboard.html");
          return;
        }

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          setMsg("Connexion…", false);

          var email = document.getElementById("email").value.trim();
          var password = document.getElementById("password").value;

          try {
            var r = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email: email, password: password }),
            });
            var data = await r.json().catch(function () {
              return {};
            });

            if (!r.ok || !data.token) {
              setMsg(data.error || "Identifiants incorrects.", true);
              return;
            }

            sessionStorage.setItem(TOKEN_KEY, data.token);
            window.location.href = "/admin/dashboard.html";
          } catch (err) {
            setMsg("Identifiants incorrects.", true);
          }
        });
      })();
    </script>
  </body>
</html>
