<!DOCTYPE html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/logo1.png" />
    <title>Dashboard — Mosquée Bilal</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="nh-site admin-dashboard-page">
    <div class="nh-bg" aria-hidden="true"></div>

    <header class="nh-header">
      <div class="nh-header-inner">
        <a class="nh-brand" href="../index.html">
          <img src="../assets/logo1.png" class="nh-brand-logo" alt="" />
          <span class="nh-brand-text">Mosquée Bilal</span>
        </a>
        <nav class="nh-nav" aria-label="Admin">
          <button class="nh-nav-toggle" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
          <ul class="nh-nav-list">
            <li><a href="#section-annonces" data-i18n-admin="navAnnonces">ANNONCES</a></li>
            <li><a href="#section-photos" data-i18n-admin="navGalerie">GALERIE</a></li>
            <li><a href="#section-categories" data-i18n-admin="navCategories">CATÉGORIES</a></li>
            <li><button type="button" id="logoutBtn" class="nh-btn nh-btn-outline" style="padding:8px 14px" data-i18n-admin="logout">Déconnexion</button></li>
          </ul>
        </nav>
        <div class="lang-switch nh-lang-switch" id="adminLangSwitch">
          <button type="button" data-lang="fr" class="active">FR</button>
          <button type="button" data-lang="ar">AR</button>
        </div>
      </div>
    </header>

    <main class="nh-main">
      <section class="nh-section annonces-admin-section">
        <div class="nh-container" style="max-width:1100px;padding-bottom:100px">
          <h1 class="nh-title" style="color:#c9a84c;margin-bottom:8px" data-i18n-admin="title">Dashboard admin</h1>
          <p class="nh-text" style="margin-bottom:28px;color:rgba(245,240,228,0.65)" data-i18n-admin="subtitle">Gérez les annonces, les photos et les catégories.</p>

          <!-- ANNONCES -->
          <section id="section-annonces">
            <h2 class="nh-kicker" style="margin:0 0 16px" data-i18n-admin="annoncesTitle">Annonces</h2>
            <form id="annonceForm" class="annonce-admin-form">
              <div class="admin-field">
                <label for="titre" data-i18n-admin="labelTitre">Titre</label>
                <input id="titre" type="text" maxlength="200" required />
              </div>
              <div class="admin-field">
                <label for="texte" data-i18n-admin="labelTexte">Texte</label>
                <textarea id="texte" rows="4" maxlength="4000" required></textarea>
              </div>
              <div class="admin-field-row">
                <div class="admin-field">
                  <label for="police" data-i18n-admin="labelPolice">Police</label>
                  <select id="police">
                    <option value="Cairo">Cairo</option>
                    <option value="Playfair Display">Playfair Display</option>
                    <option value="Arial">Arial</option>
                    <option value="Georgia">Georgia</option>
                  </select>
                </div>
                <div class="admin-field">
                  <label data-i18n-admin="labelCouleur">Couleur du texte</label>
                  <div class="admin-color-row" id="colorPalette"></div>
                  <input id="couleur" type="color" value="#f5f0e1" style="margin-top:8px;width:100%;height:40px;border:none;background:transparent" />
                </div>
              </div>
              <div class="admin-field">
                <label for="annonceFiles" data-i18n-admin="labelFichiers">Pièces jointes (PDF, images)</label>
                <input id="annonceFiles" type="file" accept="image/*,.pdf,application/pdf" multiple />
              </div>
              <button class="nh-btn nh-btn-gold" type="submit" data-i18n-admin="btnAddAnnonce">Ajouter l’annonce</button>
              <p id="formStatus" class="admin-status-inline" style="margin-top:12px"></p>
            </form>
            <h3 class="nh-kicker" style="margin:32px 0 16px" data-i18n-admin="annoncesList">Annonces existantes</h3>
            <div id="annoncesList" class="annonces-admin-list"></div>
          </section>

          <hr class="admin-section-divider" />

          <!-- CATÉGORIES -->
          <section id="section-categories">
            <h2 class="nh-kicker" style="margin:0 0 16px" data-i18n-admin="categoriesTitle">Catégories</h2>
            <form id="catForm" class="annonce-admin-form" style="margin-bottom:16px">
              <div class="admin-field">
                <label for="catNom" data-i18n-admin="labelCatNom">Nom de la catégorie</label>
                <input id="catNom" type="text" maxlength="80" required />
              </div>
              <button class="nh-btn nh-btn-gold" type="submit" data-i18n-admin="btnAddCat">Ajouter</button>
            </form>
            <div id="categoriesList" class="annonces-admin-list"></div>
          </section>

          <hr class="admin-section-divider" />

          <!-- PHOTOS -->
          <section id="section-photos">
            <div class="admin-photos-toolbar">
              <h2 class="nh-kicker" style="margin:0" data-i18n-admin="photosTitle">Gestion des photos</h2>
              <div class="admin-photos-actions">
                <button type="button" id="btnDeleteSelected" class="nh-btn nh-btn-outline admin-hidden" data-i18n-admin="btnDeleteSelected">Supprimer la sélection</button>
                <button type="button" id="btnSaveOrder" class="nh-btn nh-btn-gold admin-hidden" data-i18n-admin="btnSaveOrder">Enregistrer l’ordre</button>
              </div>
            </div>
            <p class="nh-text" style="margin:12px 0 18px;color:rgba(245,240,228,0.55)" data-i18n-admin="photosHint">
              Grille comme la galerie publique. Réordonnez, changez la catégorie, puis enregistrez.
            </p>
            <div id="photosGrid" class="mosquee-masonry-grid admin-masonry-photos"></div>
            <div class="admin-upload-zone">
              <label for="photoInput" class="admin-upload-label">
                <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
                <span data-i18n-admin="uploadHint">Ajouter des photos (sélection multiple)</span>
              </label>
              <input id="photoInput" type="file" accept="image/*" multiple />
              <p id="photoStatus" class="admin-status-inline"></p>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div id="globalSaveBar" class="admin-global-save admin-hidden">
      <button type="button" id="btnGlobalSave" class="nh-btn nh-btn-gold">
        <span data-i18n-admin="btnGlobalSave">💾 Enregistrer les modifications</span>
      </button>
    </div>

    <script src="../script.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
